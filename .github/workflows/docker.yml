# Publica la imagen en Docker Hub cada vez que se sube una etiqueta de versión (v0.7.0-beta, v1.0.0…).
# Necesita dos secretos en GitHub (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  → usuario de Docker Hub
#   DOCKERHUB_TOKEN     → token de acceso de Docker Hub (Read & Write)
# Opcional, como variable (pestaña «Variables»): DOCKERHUB_IMAGE (por defecto dagarines/agendario)
#
# Etiquetas: las betas publican «X.Y.Z-beta» y «beta»; las estables, «X.Y.Z» y «latest».
name: Imagen Docker

on:
  push:
    tags: ["v*"]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetas
        id: meta
        run: |
          V="${GITHUB_REF_NAME#v}"
          IMG="${{ vars.DOCKERHUB_IMAGE || 'dagarines/agendario' }}"
          case "$V" in
            *-*) echo "tags=$IMG:$V,$IMG:beta" >> "$GITHUB_OUTPUT" ;;
            *)   echo "tags=$IMG:$V,$IMG:latest" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
